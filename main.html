<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height: 100vh;
        }
        #container{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color:rgb(225, 203, 172);
            text-align: center;
            border-radius: 10px;
            height: 200px;
            width:500px;
        }
        .code{
            width: 40px;
            height: 40px;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <section id="container">
        <h1 id="verification_heading">Verify Your Account</h1>
        <p id="verification_subtext"> Enter a 6-digits code</p>
        <div id="code-container">
            <input type="text" class="code" maxlength="1">
            <input type="text" class="code" maxlength="1">
            <input type="text" class="code" maxlength="1">
            <input type="text" class="code" maxlength="1">
            <input type="text" class="code" maxlength="1">
            <input type="text" class="code" maxlength="1">
        </div>
    </section>
    <script>
        let codes=document.querySelectorAll(".code")
        codes[0].focus()
        codes.forEach((code,i) => {
            code.addEventListener("input" , (e) =>{
                if(code.value!="" && i< codes.length){
                    codes[i+1].focus()
                }
            })
            code.addEventListener("keydown" , (e)=>{
                if(e.key=="Backspace" && code.value==""){
                    codes[i-1].focus()
                }
            })
        })
    </script>
</body>
</html>
